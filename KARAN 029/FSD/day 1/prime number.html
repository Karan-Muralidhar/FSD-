<!DOCTYPE html>
<html>
<head>
    <title>PRIME NUMBER</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
        }

        #result {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>PRIME NUMBER</h1>

        <input type="number" id="marks"
               placeholder="ENTER NUMBER">

        <br>

        <button onclick="checkPrime()">
            Check PRIME NUMBER
        </button>

        <p id="result"></p>

    </div>

    <script>

    function checkPrime() {
        let number = Number(document.getElementById("marks").value);
        let isPrime = true;

        if (number <= 1) {
            isPrime = false;
        } else {
            for (let i = 2; i <= Math.sqrt(number); i++) {
                if (number % i === 0) {
                    isPrime = false;
                    break;
                }
            }
        }

        document.getElementById("result").innerHTML = "The number is: " + (isPrime ? "PRIME" : "NOT PRIME");
    }

        let result;

        if (number % 2 === 0) {
            result = "EVEN";
        } else {
            result = "ODD";
        }

        document.getElementById("result").innerHTML = "The number is: " + result;
    

</script>
